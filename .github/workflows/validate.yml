name: Validate portfolio
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test content and rendering
        run: npm test
      - name: Build and check committed output
        run: npm run build && git diff --exit-code -- index.html
